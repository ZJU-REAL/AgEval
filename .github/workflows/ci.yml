# Core PR/main gate: freeze install, Ruff, Pyright, offline pytest.
# Does not run Docker L1, real Agent/API e2e, or docs formatters.
#
# Path filter (scheme 2): workflow always runs; heavy steps only when
# code-relevant paths change. Docs-only pushes still get a green `core`
# job so required status checks are not left pending.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# paths-filter lists PR files via GitHub API on pull_request events.
# Default GITHUB_TOKEN with contents-only cannot call pulls API →
# "Resource not accessible by integration".
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Positive filter: unknown paths default to "no code" only if every
      # changed file is outside this list. Prefer over-running CI.
      - name: Detect code-relevant paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'sdk/**'
              - 'tests/**'
              - 'examples/**'
              - 'apps/**'
              - 'docker/**'
              - 'services/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'VERSION'
              - '.python-version'
              - '.github/workflows/**'

  core:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Skip (docs / non-code only)
        if: needs.changes.outputs.code != 'true'
        run: |
          echo "No code-relevant path changes detected; skipping Ruff / Pyright / pytest."
          echo "Filter list: src sdk tests examples apps docker services scripts"
          echo "  pyproject.toml uv.lock VERSION .python-version .github/workflows"

      - name: Checkout
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4

      - name: Install uv
        if: needs.changes.outputs.code == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python
        if: needs.changes.outputs.code == 'true'
        run: uv python install 3.12

      - name: Install dependencies (frozen)
        if: needs.changes.outputs.code == 'true'
        run: uv sync --frozen

      - name: Ruff format
        if: needs.changes.outputs.code == 'true'
        run: uv run ruff format --check src tests

      - name: Ruff check
        if: needs.changes.outputs.code == 'true'
        run: uv run ruff check src tests

      - name: Pyright
        if: needs.changes.outputs.code == 'true'
        run: uv run pyright

      # Core only: unit + offline acceptance. No Docker L1, no real agent CLIs.
      - name: Pytest (core)
        if: needs.changes.outputs.code == 'true'
        env:
          BORA_OFFLINE_AGENT: "1"
          BORA_SKIP_DOCKER: "1"
          BORA_SKIP_REAL_CODEX: "1"
          BORA_SKIP_REAL_PI: "1"
          BORA_SKIP_REAL_OPENCODE: "1"
          BORA_SKIP_REAL_ACP: "1"
        run: |
          uv run pytest \
            --ignore=tests/e2e \
            --ignore=tests/provider_l1 \
            --ignore=tests/environment \
            --ignore=tests/executors \
            --ignore=tests/acceptance/test_provider_l1_cli.py \
            --ignore=tests/acceptance/test_l1_package_dockerfile.py \
            --ignore=tests/acceptance/test_l1_sdk_single_actor.py \
            --ignore=tests/acceptance/test_l1_multi_agent_scheduling.py \
            --ignore=tests/acceptance/test_l1_multi_agent_expected_failures.py \
            --ignore=tests/acceptance/test_l1_multi_group_memory_context.py \
            --ignore=tests/acceptance/test_builtin_executor_visibility.py \
            --ignore=tests/acceptance/test_builtin_executor_conformance.py \
            --ignore=tests/acceptance/test_hard_ceiling_cli.py \
            --ignore=tests/acceptance/test_attempt_trajectory_cli.py \
            --ignore=tests/acceptance/test_environment_action_denied_cli.py \
            --ignore=tests/acceptance/test_v1_class_packages.py \
            --ignore=tests/runtime/test_trajectory_source_probe.py \
            -q
