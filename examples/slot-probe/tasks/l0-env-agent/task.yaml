format: ageval.task/1
task_id: l0-env-agent

provenance:
  kind: original

harness:
  runtime: python
  entrypoint: harness:run

parameters:
  environment_resource: postgresql
  harness_timeout_seconds: 300
  models:
    default: probe-nooa

provider:
  kind: local
  assurance: l0

agent_profiles:
  - id: probe-nooa

limits:
  wall_time_seconds: 300
  agent_invocations: 2
  environment_actions: 8

artifacts:
  publishable:
    - id: probe-report
      producer: harness
      path: artifacts/probe-report.json
      media_type: application/json

evaluation:
  runtime: python
  entrypoint: evaluator:evaluate
  network: none
  inputs:
    - artifact: probe-report
      target: artifacts/probe-report.json
  output:
    format: json
