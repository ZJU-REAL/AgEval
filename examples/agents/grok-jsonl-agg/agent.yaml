format: bora.agent/1
agent_id: grok-jsonl-agg
version: "0.1.0"
label: "Grok · jsonl-agg"
description: >-
  ACP grok-build with the jsonl-agg skill bundled in overlays/.
  Bind with --agent official/grok-jsonl-agg@0.1.0 (install first).
tags: [coding, acp, grok-build, skills]
binding:
  executor: acp
  model: entry-default
  overlays:
    - overlays/skills/jsonl-agg
    - overlays/AGENTS.md
  extensions:
    - plugin: acp
      options:
        entry: grok-build
    - plugin: agent-skills
      options:
        dest_roots: [home, workspace]
        skills:
          - src: overlays/skills/jsonl-agg
        instructions:
          - src: overlays/AGENTS.md
