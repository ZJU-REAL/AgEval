format: ageval.agent/1
agent_id: opencode-default
version: "0.1.0"
label: "OpenCode (LiteLLM overlay)"
description: >-
  OpenCode via ACP. Bundles overlays/opencode.litellm.json into
  $HOME/.config/opencode. baseURL and apiKey stay env locators.
tags: [coding, acp, opencode]
binding:
  executor: acp
  model: entry-default
  overlays:
    - overlays/opencode.litellm.json
  extensions:
    - plugin: acp
      options:
        entry: opencode
    - plugin: home-files
      options:
        files:
          - src: overlays/opencode.litellm.json
            dest: .config/opencode/opencode.json
            dest_root: home
