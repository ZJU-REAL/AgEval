format: ageval.task/1
task_id: alf-put-mug
harness:
  runtime: python
  entrypoint: harness:run
parameters:
  goal: put the mug on the desk
  world:
    objects:
      mug:
        at: coffee table
      apple:
        at: sidetable
    receptacles:
    - coffee table
    - desk
    - sidetable
    closed: []
  max_steps: 6
  goal_spec:
    mug: desk
provider:
  kind: local
  assurance: l0
agent_profiles:
- id: solver
limits:
  wall_time_seconds: 900
  agent_invocations: 10
  environment_actions: 0
artifacts:
  publishable:
  - id: trace
    producer: harness
    path: artifacts/trace.json
    media_type: application/json
evaluation:
  runtime: python
  entrypoint: evaluator:evaluate
  network: none
  inputs:
  - artifact: trace
    target: trace.json
  output:
    format: json
