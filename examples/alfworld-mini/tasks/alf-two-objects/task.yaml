format: ageval.task/1
task_id: alf-two-objects
harness:
  runtime: python
  entrypoint: harness:run
parameters:
  goal: put the apple and the mug on the desk
  world:
    objects:
      apple:
        at: sidetable
      mug:
        at: coffee table
    receptacles:
    - coffee table
    - desk
    - sidetable
    closed: []
  max_steps: 10
  goal_spec:
    apple: desk
    mug: desk
provider:
  kind: local
  assurance: l0
agent_profiles:
- id: solver
limits:
  wall_time_seconds: 900
  agent_invocations: 14
  environment_actions: 0
artifacts:
  publishable:
  - id: trace
    producer: harness
    path: artifacts/trace.json
    media_type: application/json
evaluation:
  runtime: python
  entrypoint: evaluator:evaluate
  network: none
  inputs:
  - artifact: trace
    target: trace.json
  output:
    format: json
