format: ageval.task/1
task_id: alf-drawer-key
harness:
  runtime: python
  entrypoint: harness:run
parameters:
  goal: find the key and put it on the desk
  world:
    objects:
      key:
        at: drawer
      pen:
        at: desk
    receptacles:
    - desk
    - drawer
    - shelf
    closed:
    - drawer
  max_steps: 8
  goal_spec:
    key: desk
provider:
  kind: local
  assurance: l0
agent_profiles:
- id: solver
limits:
  wall_time_seconds: 900
  agent_invocations: 12
  environment_actions: 0
artifacts:
  publishable:
  - id: trace
    producer: harness
    path: artifacts/trace.json
    media_type: application/json
evaluation:
  runtime: python
  entrypoint: evaluator:evaluate
  network: none
  inputs:
  - artifact: trace
    target: trace.json
  output:
    format: json
