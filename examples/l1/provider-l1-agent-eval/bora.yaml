format: bora.task/1
task_id: provider-l1-agent-eval

harness:
  runtime: python
  entrypoint: harness:run

parameters:
  use_agent_session: true
  question: "Return JSON {\"answer\": 42}"
  harness_timeout_seconds: 180
  models:
    default: codex-mini

provider:
  kind: docker
  assurance: l1
  platform: linux/arm64
  network: bridge

agent_profiles:
  - id: codex-mini
    executor: acp
    options:
      entry: codex
    model: gpt-5.4-mini

limits:
  wall_time_seconds: 180
  agent_invocations: 1
  environment_actions: 0

artifacts:
  publishable:
    - id: agent-output
      producer: harness
      path: artifacts/agent-output.json
      media_type: application/json

evaluation:
  runtime: python
  entrypoint: evaluator:evaluate
  network: none
  inputs:
    - artifact: agent-output
      target: artifacts/agent-output.json
  output:
    format: json
