format: bora.task/1
task_id: multi-agent-shared-container

harness:
  runtime: python
  entrypoint: harness:run

parameters:
  harness_timeout_seconds: 420
  models:
    planner: planner-codex
    reviewer: reviewer-codex

provider:
  kind: docker
  assurance: l1
  platform: linux/arm64
  network: bridge
  agent_isolation:
    mode: shared-container
    groups:
      - id: team
        actors:
          - id: planner
            profiles: [planner-codex]
          - id: reviewer
            profiles: [reviewer-codex]
        shared_write: [team]

agent_profiles:
  - id: planner-codex
    executor: acp
    options:
      entry: codex
    model: gpt-5.4-mini
  - id: reviewer-codex
    executor: acp
    options:
      entry: codex
    model: gpt-5.4-mini

limits:
  wall_time_seconds: 420
  agent_invocations: 4
  environment_actions: 0

artifacts:
  publishable:
    - id: session-output
      producer: harness
      path: artifacts/session-output.json
      media_type: application/json

evaluation:
  runtime: python
  entrypoint: evaluator:evaluate
  network: none
  inputs:
    - artifact: session-output
      target: artifacts/session-output.json
  output:
    format: json
