format: bora.task/1
task_id: multi-agent-container-per-group

harness:
  runtime: python
  entrypoint: harness:run

parameters:
  harness_timeout_seconds: 420
  models:
    planner: planner-codex
    worker: worker-codex

provider:
  kind: docker
  assurance: l1
  platform: linux/arm64
  network: bridge
  agent_isolation:
    mode: container-per-group
    groups:
      - id: analysis
        actors:
          - id: planner
            profiles: [planner-codex]
      - id: execution
        actors:
          - id: worker
            profiles: [worker-codex]

agent_profiles:
  - id: planner-codex
    executor: acp
    options:
      entry: codex
    model: gpt-5.4-mini
  - id: worker-codex
    executor: acp
    options:
      entry: codex
    model: gpt-5.4-mini

limits:
  wall_time_seconds: 420
  agent_invocations: 4
  environment_actions: 0

artifacts:
  publishable:
    - id: session-output
      producer: harness
      path: artifacts/session-output.json
      media_type: application/json

evaluation:
  runtime: python
  entrypoint: evaluator:evaluate
  network: none
  inputs:
    - artifact: session-output
      target: artifacts/session-output.json
  output:
    format: json
