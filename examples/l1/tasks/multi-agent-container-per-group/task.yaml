format: bora.task/1
task_id: multi-agent-container-per-group
harness:
  runtime: python
  entrypoint: harness:run
parameters:
  harness_timeout_seconds: 420
  models:
    planner: planner
    worker: worker
provider:
  kind: docker
  assurance: l1
  platform: linux/arm64
  network: bridge
  agent_isolation:
    mode: container-per-group
    groups:
    - id: analysis
      actors:
      - id: planner
        profiles:
        - planner
    - id: execution
      actors:
      - id: worker
        profiles:
        - worker
agent_profiles:
- id: planner
- id: worker
limits:
  wall_time_seconds: 420
  agent_invocations: 4
  environment_actions: 0
artifacts:
  publishable:
  - id: session-output
    producer: harness
    path: artifacts/session-output.json
    media_type: application/json
evaluation:
  runtime: python
  entrypoint: evaluator:evaluate
  network: none
  inputs:
  - artifact: session-output
    target: artifacts/session-output.json
  output:
    format: json
