format: ageval.task/1
task_id: executor-image-official
parameters:
  harness_timeout_seconds: 300
agent_profiles:
- id: pi-solver
limits:
  wall_time_seconds: 300
  agent_invocations: 1
artifacts:
  publishable:
  - id: agent-output
    path: artifacts/agent-output.json
evaluation:
  inputs:
  - artifact: agent-output
    target: artifacts/agent-output.json
