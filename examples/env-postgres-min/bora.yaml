format: bora.task/1
task_id: env-postgres-min

harness:
  runtime: python
  entrypoint: harness:run

parameters:
  use_agent_session: false
  question: 'Return ONLY JSON {"status":"ok","note":"env-ready"} with no other keys.'
  environment_resource: postgresql
  models:
    default: codex-mini

provider:
  kind: local
  assurance: l0

agent_profiles:
  - id: codex-mini
    executor: codex
    model: gpt-5.4-mini

limits:
  wall_time_seconds: 300
  agent_invocations: 1
  environment_actions: 5

artifacts:
  publishable:
    - id: env-result
      producer: harness
      path: artifacts/env-result.json
      media_type: application/json

evaluation:
  runtime: python
  entrypoint: evaluator:evaluate
  network: none
  inputs:
    - artifact: env-result
      target: artifacts/env-result.json
  output:
    format: json
