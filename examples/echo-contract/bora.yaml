format: bora.task/1
task_id: echo-contract

harness:
  runtime: python
  entrypoint: harness:run

parameters:
  question: 'Return ONLY JSON {"echo":"BORA_CODEX_MVP_OK"} with no other keys.'
  models:
    default: codex-mini

provider:
  kind: local
  assurance: l0

agent_profiles:
  - id: codex-mini
    executor: codex
    model: gpt-5.4-mini

limits:
  wall_time_seconds: 180
  agent_invocations: 1
  environment_actions: 0

artifacts:
  publishable:
    - id: answer
      producer: harness
      path: artifacts/answer.json
      media_type: application/json

evaluation:
  runtime: python
  entrypoint: evaluator:evaluate
  network: none
  inputs:
    - artifact: answer
      target: artifacts/answer.json
  output:
    format: json
