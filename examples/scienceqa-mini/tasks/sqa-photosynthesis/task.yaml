format: bora.task/1
task_id: sqa-photosynthesis
harness:
  runtime: python
  entrypoint: harness:run
parameters:
  question: Which gas do plants primarily absorb from the air to perform photosynthesis?
  options:
    A: Oxygen
    B: Carbon dioxide
    C: Nitrogen
    D: Hydrogen
provider:
  kind: local
  assurance: l0
agent_profiles:
- id: solver
limits:
  wall_time_seconds: 300
  agent_invocations: 2
  environment_actions: 0
artifacts:
  publishable:
  - id: answer
    producer: harness
    path: artifacts/answer.json
    media_type: application/json
evaluation:
  runtime: python
  entrypoint: evaluator:evaluate
  network: none
  inputs:
  - artifact: answer
    target: answer.json
  output:
    format: json
