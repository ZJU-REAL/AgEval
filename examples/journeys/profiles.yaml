format: bora.profiles/1
bindings:
  solver:
    executor: acp
    extensions:
      - plugin: acp
        options:
          entry: pi
    model: zai-coding-cn/glm-5.2
    api_key: ${glm_coding_api_key}
  user:
    executor: acp
    extensions:
      - plugin: acp
        options:
          entry: grok-build
    model: entry-default
  service:
    executor: acp
    extensions:
      - plugin: acp
        options:
          entry: opencode
    model: zai-coding-plan/glm-5.2
    api_key: ${glm_coding_api_key}
  specialist:
    executor: acp
    extensions:
      - plugin: acp
        options:
          entry: pi
    model: zai-coding-cn/glm-5.2
    api_key: ${glm_coding_api_key}
  planner:
    executor: acp
    extensions:
      - plugin: acp
        options:
          entry: opencode
    model: zai-coding-plan/glm-5.2
    api_key: ${glm_coding_api_key}
  reducer:
    executor: acp
    extensions:
      - plugin: acp
        options:
          entry: grok-build
    model: entry-default
