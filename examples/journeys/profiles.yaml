format: ageval.profiles/1

# Journeys run in a container: these tasks ship image recipes and sidecars.
environment: docker

agent_profiles:
  "*":
    executor: acp
    model: zai-coding-cn/glm-5.2
    api_key: ${ZHIPU_API_KEY}
    options:
      entry: pi
    extensions:
      - plugin: acp
      - plugin: docker
