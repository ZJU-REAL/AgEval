format: bora.task/1
task_id: terminal-jsonl-agg

harness:
  runtime: python
  entrypoint: harness:run

parameters:
  # Type-B terminal class: Runtime seeds workspace from data/, runs ACP agent
  # with cwd=workspace, collects declared relative file (not use_agent_session).
  workspace_output: aggregates.json
  agent_timeout_seconds: 420
  models:
    default: terminal-pi

provider:
  kind: docker
  assurance: l1
  platform: linux/arm64
  # Residual ACP agent container uses bridge for model API; package policy
  # still filters evaluation/ from the harness mount.
  network: bridge

agent_profiles:
  # Default L1 coding agent via unified ACP (pi Mode 1 — host-proven in image).
  - id: terminal-pi
    executor: acp
    options:
      entry: pi
    model: zai-coding-cn/glm-5.2
    api_key: glm_coding_api_key
  - id: terminal-opencode
    executor: acp
    options:
      entry: opencode
    model: zai-coding-plan/glm-5.2
    api_key: glm_coding_api_key
  - id: terminal-grok
    executor: acp
    options:
      entry: grok-build
    model: entry-default

limits:
  wall_time_seconds: 720
  agent_invocations: 1
  environment_actions: 0

artifacts:
  publishable:
    - id: aggregates
      producer: harness
      path: artifacts/aggregates.json
      media_type: application/json

evaluation:
  runtime: python
  entrypoint: evaluator:evaluate
  network: none
  inputs:
    - artifact: aggregates
      target: artifacts/aggregates.json
  output:
    format: json
