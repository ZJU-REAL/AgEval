format: ageval.profiles/1

# ssh A + nooa: worker via host.exec. GLM Coding Plan OpenAI-compatible endpoint.
environment: ssh
environment_options:
  host: ${AGEVAL_SSH_HOST}
  user: ${AGEVAL_SSH_USER}
  port: ${AGEVAL_SSH_PORT}
  key_env: AGEVAL_SSH_KEY
  image: ""

agent_profiles:
  solver:
    executor: nooa
    extensions:
      - plugin: nooa
        options:
          agent: "lib.agents:JsonlAggAgent"
          method: "run"
      - plugin: ssh
    model: openai/glm-5.2
    api_key: ${glm_coding_api_key}
    base_url: https://open.bigmodel.cn/api/coding/paas/v4
