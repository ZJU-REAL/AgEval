# Journeys binding for the miniswe plugin (host loop + docker-exec bash).
# Usage:
#   uv sync --extra miniswe
#   uv run bora plugin install plugins/miniswe
#   uv run bora run examples/journeys --task terminal-jsonl-agg \
#     --profiles examples/journeys/profiles.miniswe.yaml
format: bora.profiles/1
bindings:
  solver:
    executor: miniswe
    extensions:
      - plugin: miniswe
        options:
          step_limit: 20
          cost_limit: 0
          cmd_timeout: 60
    model: openai/glm-5.2
    api_key: ${litellm_api_key}
    base_url: ${litellm_base_url}
