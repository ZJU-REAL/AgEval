format: ageval.profiles/1
environment: docker
agent_profiles:
  solver:
    executor: nooa
    extensions:
    - plugin: nooa
      options:
        agent: lib.agents:JsonlAggAgent
        method: run
    - plugin: docker
    model: openai/glm-5.2
    api_key: ${litellm_api_key}
  user:
    executor: nooa
    extensions:
    - plugin: nooa
      options:
        agent: lib.agents:UserSimAgent
        method: run
    - plugin: docker
    model: openai/glm-5.2
    api_key: ${litellm_api_key}
  service:
    executor: nooa
    extensions:
    - plugin: nooa
      options:
        agent: lib.agents:ServiceAgent
        method: run
    - plugin: docker
    model: openai/glm-5.2
    api_key: ${litellm_api_key}
  specialist:
    executor: nooa
    extensions:
    - plugin: nooa
      options:
        agent: lib.agents:SpecialistAgent
        method: run
    - plugin: docker
    model: openai/glm-5.2
    api_key: ${litellm_api_key}
  planner:
    executor: nooa
    extensions:
    - plugin: nooa
      options:
        agent: lib.agents:PlannerAgent
        method: run
    - plugin: docker
    model: openai/glm-5.2
    api_key: ${litellm_api_key}
  reducer:
    executor: nooa
    extensions:
    - plugin: nooa
      options:
        agent: lib.agents:ReducerAgent
        method: run
    - plugin: docker
    model: openai/glm-5.2
    api_key: ${litellm_api_key}
