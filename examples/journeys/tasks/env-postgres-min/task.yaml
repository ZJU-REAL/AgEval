format: ageval.task/1
task_id: env-postgres-min
description: A sidecar the box brings up itself, with no orchestrator in between.

provenance:
  kind: original

# Shipping environment/compose.yaml means this task needs a box that can
# compose; a kind that cannot say so fails the lock.
requires:
  environment:
    - compose

agent_profiles: []

limits:
  wall_time_seconds: 600
  agent_invocations: 0

artifacts:
  publishable:
    - id: env-result
      path: artifacts/env-result.json

evaluation:
  inputs:
    - artifact: env-result
      target: artifacts/env-result.json
