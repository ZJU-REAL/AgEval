format: bora.task/1
task_id: env-postgres-min

# BORA Core env smoke — not an upstream port.
provenance:
  kind: original

harness:
  runtime: python
  entrypoint: harness:run

# Env + package-local tool smoke. No agent on the default path.
parameters:
  environment_resource: postgresql

provider:
  kind: local
  assurance: l0

agent_profiles: []

limits:
  wall_time_seconds: 300
  agent_invocations: 0
  environment_actions: 5

artifacts:
  publishable:
    - id: env-result
      producer: harness
      path: artifacts/env-result.json
      media_type: application/json

evaluation:
  runtime: python
  entrypoint: evaluator:evaluate
  network: none
  inputs:
    - artifact: env-result
      target: artifacts/env-result.json
  output:
    format: json
