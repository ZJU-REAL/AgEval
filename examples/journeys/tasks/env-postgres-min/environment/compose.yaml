# The sidecar. The Attempt container joins this project's network, so the
# service is an ordinary hostname inside the box and nothing needs an
# Environment Manager in between.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ageval
      POSTGRES_USER: ageval
      POSTGRES_DB: smoke
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ageval -d smoke"]
      interval: 2s
      timeout: 3s
      retries: 30
