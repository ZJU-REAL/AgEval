format: bora.task/1
task_id: tau2-dialog-min

# Inspired by τ-bench retail dialog (user-sim + service tools); BORA journey mini-package.
provenance:
  kind: reimplementation
  upstream:
    name: tau2-bench
    url: https://github.com/sierra-research/tau2-bench
    ref: main
  parity:
    claims: [protocol]
    known_gaps:
      - minimal BORA case class, not full tau2 suite or task pin
      - synthetic retail fixture; not upstream scenario dump

harness:
  runtime: python
  entrypoint: harness:run

parameters:
  harness_timeout_seconds: 900
  # Dual-role ACP sessions (harness uses profile ids only).
  roles:
    user: user-grok
    service: service-opencode
  models:
    default: service-opencode

provider:
  kind: local
  assurance: l0

agent_profiles:
  # User-sim: grok-build tends to follow fixture-style JSON instructions cleanly.
  - id: user-grok
    executor: acp
    options:
      entry: grok-build
    model: entry-default
  - id: service-opencode
    executor: acp
    options:
      entry: opencode
    model: zai-coding-plan/glm-5.2
    api_key: glm_coding_api_key
  # Optional alternate for user-sim (coding agents may refuse retail roleplay).
  - id: user-pi
    executor: acp
    options:
      entry: pi
    model: zai-coding-cn/glm-5.2
    api_key: glm_coding_api_key

limits:
  wall_time_seconds: 900
  agent_invocations: 12
  environment_actions: 0

artifacts:
  publishable:
    - id: final-state
      producer: harness
      path: artifacts/final-state.json
      media_type: application/json

evaluation:
  runtime: python
  entrypoint: evaluator:evaluate
  network: none
  inputs:
    - artifact: final-state
      target: artifacts/final-state.json
  output:
    format: json
