format: bora.task/1
task_id: tau2-dialog-min
provenance:
  kind: reimplementation
  upstream:
    name: tau2-bench
    url: https://github.com/sierra-research/tau2-bench
    ref: main
  parity:
    claims:
    - protocol
    known_gaps:
    - minimal BORA case class, not full tau2 suite or task pin
    - synthetic retail fixture; not upstream scenario dump
harness:
  runtime: python
  entrypoint: harness:run
parameters:
  harness_timeout_seconds: 900
  roles:
    user: user
    service: service
  models:
    default: service
provider:
  kind: local
  assurance: l0
agent_profiles:
- id: user
- id: service
limits:
  wall_time_seconds: 900
  agent_invocations: 12
  environment_actions: 0
artifacts:
  publishable:
  - id: final-state
    producer: harness
    path: artifacts/final-state.json
    media_type: application/json
evaluation:
  runtime: python
  entrypoint: evaluator:evaluate
  network: none
  inputs:
  - artifact: final-state
    target: artifacts/final-state.json
  output:
    format: json
