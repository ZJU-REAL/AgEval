format: ageval.profiles/1
environment: docker
agent_profiles:
  solver:
    executor: acp
    overlays:
    - overlays/skills/jsonl-agg
    - overlays/AGENTS.md
    extensions:
    - plugin: acp
    - plugin: agent-skills
      options:
        dest_roots:
        - home
        - workspace
        skills:
        - src: overlays/skills/jsonl-agg
        instructions:
        - src: overlays/AGENTS.md
    - plugin: docker
    model: entry-default
    options:
      entry: grok-build
