format: ageval.profiles/1
environment: docker
agent_profiles:
  solver:
    executor: acp
    extensions:
    - plugin: acp
    - plugin: home-files
      options:
        files:
        - src: overlays/pi.litellm.json
          dest: .pi/agent/models.json
          dest_root: home
    - plugin: docker
    model: litellm/dashscope/deepseek-v4-pro
    api_key: ${litellm_api_key}
    base_url: ${litellm_base_url}
    options:
      entry: pi
