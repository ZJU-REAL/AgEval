format: ageval.profiles/1
environment: docker
agent_profiles:
  solver:
    executor: acp
    extensions:
    - plugin: acp
    - plugin: home-files
      options:
        files:
        - src: overlays/opencode.litellm.json
          dest: .config/opencode/opencode.json
          dest_root: home
    - plugin: docker
    model: zai-coding-plan/glm-5.2
    api_key: ${litellm_api_key}
    base_url: ${litellm_base_url}
    options:
      entry: opencode
