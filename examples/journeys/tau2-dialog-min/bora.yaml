format: bora.task/1
task_id: tau2-dialog-min

harness:
  runtime: python
  entrypoint: harness:run

parameters:
  use_agent_session: true
  harness_timeout_seconds: 900
  models:
    default: codex-mini

provider:
  kind: local
  assurance: l0

agent_profiles:
  - id: codex-mini
    executor: codex
    model: gpt-5.4-mini

limits:
  wall_time_seconds: 900
  agent_invocations: 10
  environment_actions: 0

artifacts:
  publishable:
    - id: final-state
      producer: harness
      path: artifacts/final-state.json
      media_type: application/json

evaluation:
  runtime: python
  entrypoint: evaluator:evaluate
  network: none
  inputs:
    - artifact: final-state
      target: artifacts/final-state.json
  output:
    format: json
