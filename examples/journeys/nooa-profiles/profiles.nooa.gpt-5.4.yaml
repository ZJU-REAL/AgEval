# LiteLLM feasibility overlay for terminal-jsonl-agg (nooa).
# model: openai/gpt-5.4
format: bora.profiles/1
bindings:
  solver:
    executor: nooa
    extensions:
      - plugin: nooa
        options:
          agent: "lib.agents:JsonlAggAgent"
          method: "run"
    model: openai/gpt-5.4
    api_key: ${litellm_api_key}
