format: ageval.task/1
task_id: ws-mug
harness:
  runtime: python
  entrypoint: harness:run
parameters:
  instruction: Buy a ceramic coffee mug, 350ml size, under $15. Select the size before
    buying.
  catalog:
  - id: m201
    title: Ceramic Coffee Mug Classic
    price: 9.99
    attributes:
    - ceramic
    - mug
    - dishwasher safe
    options:
      size:
      - 250ml
      - 350ml
      - 500ml
      color:
      - white
      - black
  - id: m202
    title: Ceramic Coffee Mug Artisan
    price: 18.5
    attributes:
    - ceramic
    - mug
    - handmade
    options:
      size:
      - 350ml
      color:
      - blue
  - id: m203
    title: Steel Travel Mug
    price: 12.99
    attributes:
    - stainless steel
    - mug
    - insulated
    options:
      size:
      - 350ml
      - 450ml
  max_steps: 10
provider:
  kind: local
  assurance: l0
agent_profiles:
- id: solver
limits:
  wall_time_seconds: 900
  agent_invocations: 14
  environment_actions: 0
artifacts:
  publishable:
  - id: purchase
    producer: harness
    path: artifacts/purchase.json
    media_type: application/json
evaluation:
  runtime: python
  entrypoint: evaluator:evaluate
  network: none
  inputs:
  - artifact: purchase
    target: purchase.json
  output:
    format: json
