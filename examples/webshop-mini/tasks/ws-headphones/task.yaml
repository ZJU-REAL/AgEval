format: ageval.task/1
task_id: ws-headphones
harness:
  runtime: python
  entrypoint: harness:run
parameters:
  instruction: Buy black wireless over-ear headphones under $50. Select the color
    before buying.
  catalog:
  - id: h101
    title: Wireless Over-Ear Headphones Pro
    price: 79.99
    attributes:
    - wireless
    - over-ear
    - noise cancelling
    options:
      color:
      - black
      - silver
  - id: h102
    title: Wireless Over-Ear Headphones Lite
    price: 39.99
    attributes:
    - wireless
    - over-ear
    - 40h battery
    options:
      color:
      - black
      - white
  - id: h103
    title: Wired Over-Ear Studio Headphones
    price: 45.0
    attributes:
    - wired
    - over-ear
    - studio
    options:
      color:
      - black
  - id: h104
    title: Wireless Earbuds Mini
    price: 29.99
    attributes:
    - wireless
    - in-ear
    options:
      color:
      - black
      - blue
  max_steps: 10
provider:
  kind: local
  assurance: l0
agent_profiles:
- id: solver
limits:
  wall_time_seconds: 900
  agent_invocations: 14
  environment_actions: 0
artifacts:
  publishable:
  - id: purchase
    producer: harness
    path: artifacts/purchase.json
    media_type: application/json
evaluation:
  runtime: python
  entrypoint: evaluator:evaluate
  network: none
  inputs:
  - artifact: purchase
    target: purchase.json
  output:
    format: json
