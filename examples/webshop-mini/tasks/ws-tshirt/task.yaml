format: bora.task/1
task_id: ws-tshirt
harness:
  runtime: python
  entrypoint: harness:run
parameters:
  instruction: Buy a red cotton t-shirt for less than $20. Select the color before
    buying.
  catalog:
  - id: b001
    title: Red Cotton T-Shirt Classic
    price: 14.99
    attributes:
    - cotton
    - t-shirt
    - machine washable
    options:
      color:
      - red
      - blue
      - white
      size:
      - s
      - m
      - l
  - id: b002
    title: Red Polyester Sport T-Shirt
    price: 12.5
    attributes:
    - polyester
    - t-shirt
    - quick dry
    options:
      color:
      - red
      - black
      size:
      - m
      - l
  - id: b003
    title: Premium Red Cotton T-Shirt
    price: 25.0
    attributes:
    - cotton
    - t-shirt
    - premium
    options:
      color:
      - red
      size:
      - s
      - m
      - l
      - xl
  - id: b004
    title: Blue Cotton T-Shirt Classic
    price: 13.99
    attributes:
    - cotton
    - t-shirt
    options:
      color:
      - blue
      - white
      size:
      - s
      - m
  max_steps: 10
provider:
  kind: local
  assurance: l0
agent_profiles:
- id: solver
limits:
  wall_time_seconds: 900
  agent_invocations: 14
  environment_actions: 0
artifacts:
  publishable:
  - id: purchase
    producer: harness
    path: artifacts/purchase.json
    media_type: application/json
evaluation:
  runtime: python
  entrypoint: evaluator:evaluate
  network: none
  inputs:
  - artifact: purchase
    target: purchase.json
  output:
    format: json
