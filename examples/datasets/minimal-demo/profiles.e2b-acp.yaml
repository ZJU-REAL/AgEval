format: ageval.profiles/1

# Ready-made e2b template (pi already on the image). No Dockerfile bake.
environment: e2b
environment_options:
  template_id: ipwazbgpjpapvv8s2nyf

agent_profiles:
  solver:
    executor: acp
    model: zai-coding-cn/glm-5.3
    api_key: ${glm_coding_api_key}
    options:
      entry: pi
    extensions:
      - plugin: acp
      - plugin: e2b
