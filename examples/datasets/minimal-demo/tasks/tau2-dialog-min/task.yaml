format: ageval.task/1
task_id: tau2-dialog-min
provenance:
  kind: reimplementation
  upstream:
    name: tau2-bench
    url: https://github.com/sierra-research/tau2-bench
    ref: main
  parity:
    claims:
    - protocol
    known_gaps:
    - minimal ageval case class, not full tau2 suite or task pin
    - synthetic retail fixture; not upstream scenario dump
parameters:
  harness_timeout_seconds: 900
  roles:
    user: user
    service: service
  models:
    default: service
agent_profiles:
- id: user
- id: service
limits:
  wall_time_seconds: 900
  agent_invocations: 12
artifacts:
  publishable:
  - id: final-state
    path: artifacts/final-state.json
evaluation:
  inputs:
  - artifact: final-state
    target: artifacts/final-state.json
