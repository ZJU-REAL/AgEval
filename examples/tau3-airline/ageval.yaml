format: ageval.dataset/1
database_id: my-lab/tau3-airline
version: "0.1.0"
description: >
  τ³-bench (tau2-bench) airline domain port as a ageval Dataset.
  Dual-role dialog (user sim + service agent) with upstream tools/DB/evaluator truth.
  Scenario cut: airline only (one domain = one Dataset).
tasks:
  root: tasks
defaults:
  max_concurrent_tasks: 1
provenance:
  kind: port
  upstream:
    name: tau2-bench
    url: https://github.com/sierra-research/tau2-bench
    ref: v1.0.1
    commit: fc0055dc4e0a316c3f83133267fbd6faaa770992
    paper: https://arxiv.org/abs/2506.07982
  parity:
    claims:
      - protocol
      - scoring
    known_gaps:
      - "ageval outer lifecycle + ACP agents; not bit-identical tau2 CLI runner"
      - "airline domain only; not multi-domain suite"
      - "NL assertions present upstream but not in reward_basis (DB+COMMUNICATE only)"
