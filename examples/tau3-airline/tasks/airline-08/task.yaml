format: ageval.task/1
task_id: airline-08
provenance:
  kind: port
  upstream:
    name: tau2-bench
    url: https://github.com/sierra-research/tau2-bench
    ref: v1.0.1
    commit: fc0055dc4e0a316c3f83133267fbd6faaa770992
    task_id: "8"
    paper: https://arxiv.org/abs/2506.07982
  parity:
    claims:
      - protocol
      - scoring
    known_gaps:
      - "ageval ACP dual-agent loop; not tau2 litellm runner"
      - "Host must provide tau2==1.0.1 for tools/DB when package-local data omitted"
harness:
  runtime: python
  entrypoint: harness:run
parameters:
  upstream_task_id: "8"
  harness_timeout_seconds: 1200
  max_user_turns: 12
  max_service_steps: 40
  roles:
    user: user
    service: service
  models:
    default: service
provider:
  kind: local
  assurance: l0
agent_profiles:
  - id: user
  - id: service
limits:
  wall_time_seconds: 1200
  agent_invocations: 80
  environment_actions: 0
artifacts:
  publishable:
    - id: simulation
      producer: harness
      path: artifacts/simulation.json
      media_type: application/json
evaluation:
  runtime: python
  entrypoint: evaluator:evaluate
  network: none
  inputs:
    - artifact: simulation
      target: artifacts/simulation.json
  output:
    format: json
