format: bora.task/1
task_id: acp-agent-conformance

harness:
  runtime: python
  entrypoint: harness:run

parameters:
  use_agent_session: true
  harness_timeout_seconds: 360
  # Profile-only switch — Harness never branches on entry/executor name.
  active_profile: opencode-acp
  models:
    default: opencode-acp

provider:
  kind: local
  assurance: l0

agent_profiles:
  - id: opencode-acp
    executor: acp
    model: entry-default
    options:
      entry: opencode
  - id: codex-acp
    executor: acp
    model: entry-default
    options:
      entry: codex
  - id: claude-acp
    executor: acp
    model: entry-default
    options:
      entry: claude-code
  - id: pi-acp
    executor: acp
    model: entry-default
    options:
      entry: pi
  - id: grok-build-acp
    executor: acp
    model: entry-default
    options:
      entry: grok-build

limits:
  wall_time_seconds: 360
  agent_invocations: 2
  environment_actions: 0

artifacts:
  publishable:
    - id: session-output
      producer: harness
      path: artifacts/session-output.json
      media_type: application/json

evaluation:
  runtime: python
  entrypoint: evaluator:evaluate
  network: none
  inputs:
    - artifact: session-output
      target: artifacts/session-output.json
  output:
    format: json
