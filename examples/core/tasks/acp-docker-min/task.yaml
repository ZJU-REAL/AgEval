format: ageval.task/1
task_id: acp-docker-min
description: The local ACP task again, in a container, with gold arriving late.

parameters:
  instruction: >-
    Create a file named answer.txt in your current working directory whose only
    content is the number 42. Then reply with the single word DONE.

agent_profiles:
  - id: solver

limits:
  wall_time_seconds: 900
  agent_invocations: 1

artifacts:
  publishable:
    - id: reply
      path: artifacts/reply.json

evaluation:
  inputs:
    - package_path: evaluation/expected.txt
      target: evaluation/expected.txt
