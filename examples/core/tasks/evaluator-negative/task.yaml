format: ageval.task/1
task_id: evaluator-negative

harness:
  runtime: python
  entrypoint: harness:run

parameters:
  seed: 1

provider:
  kind: local
  assurance: l0

agent_profiles: []

limits:
  wall_time_seconds: 60
  agent_invocations: 0
  environment_actions: 0

artifacts:
  publishable:
    - id: agent-output
      producer: harness
      path: artifacts/agent-output.json
      media_type: application/json

evaluation:
  runtime: python
  entrypoint: evaluator:evaluate
  network: none
  inputs:
    - artifact: agent-output
      target: artifacts/agent-output.json
  output:
    format: json
