format: ageval.task/1
task_id: config-minimal
parameters:
  seed: 1
agent_profiles:
- id: solver
limits:
  wall_time_seconds: 60
  agent_invocations: 1
artifacts:
  publishable:
  - id: result
    path: artifacts/result.json
evaluation:
  inputs:
  - artifact: result
    target: artifacts/result.json
