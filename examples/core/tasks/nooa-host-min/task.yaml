format: ageval.task/1
task_id: nooa-host-min
agent_profiles:
- id: solver
limits:
  wall_time_seconds: 60
  agent_invocations: 1
artifacts:
  publishable:
  - id: agent-output
    path: artifacts/agent-output.json
evaluation:
  inputs:
  - artifact: agent-output
    target: artifacts/agent-output.json
