format: ageval.task/1
task_id: environment-action-denied

harness:
  runtime: python
  entrypoint: harness:run

parameters:
  environment_resource: postgresql
  harness_timeout_seconds: 120
  probe_mode: undeclared_action

provider:
  kind: local
  assurance: l0

agent_profiles: []

limits:
  wall_time_seconds: 120
  agent_invocations: 0
  environment_actions: 10

artifacts:
  publishable:
    - id: deny-output
      producer: harness
      path: artifacts/deny-output.json
      media_type: application/json

evaluation:
  runtime: python
  entrypoint: evaluator:evaluate
  network: none
  inputs:
    - artifact: deny-output
      target: artifacts/deny-output.json
  output:
    format: json
