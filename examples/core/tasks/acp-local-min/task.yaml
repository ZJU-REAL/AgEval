format: ageval.task/1
task_id: acp-local-min
description: One real ACP invoke in a local box; the evaluator judges what it wrote.

parameters:
  seed: 1
  instruction: >-
    Create a file named answer.txt in your current working directory whose only
    content is the number 42. Then reply with the single word DONE.
  expected: "42"

agent_profiles:
  - id: solver

limits:
  wall_time_seconds: 600
  agent_invocations: 1

artifacts:
  publishable:
    - id: reply
      path: artifacts/reply.json

evaluation:
  inputs:
    - artifact: reply
      target: artifacts/reply.json
