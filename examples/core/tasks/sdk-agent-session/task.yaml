format: ageval.task/1
task_id: sdk-agent-session
description: Two real parent-bound Agent invokes through the SDK session API.
parameters:
  models:
    default: solver
agent_profiles:
  - id: solver
limits:
  wall_time_seconds: 360
  agent_invocations: 2
artifacts:
  publishable:
    - id: session-output
      path: artifacts/session-output.json
evaluation:
  inputs:
    - artifact: session-output
      target: artifacts/session-output.json
