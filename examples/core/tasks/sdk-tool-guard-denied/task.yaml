format: ageval.task/1
task_id: sdk-tool-guard-denied

harness:
  runtime: python
  entrypoint: harness:run

parameters:
  call_limit: 2
  mode: denied

provider:
  kind: local
  assurance: l0

agent_profiles: []

limits:
  wall_time_seconds: 60
  agent_invocations: 0
  environment_actions: 0

artifacts:
  publishable:
    - id: tool-trace
      producer: harness
      path: artifacts/tool-trace.json
      media_type: application/json

evaluation:
  runtime: python
  entrypoint: evaluator:evaluate
  network: none
  inputs:
    - artifact: tool-trace
      target: artifacts/tool-trace.json
  output:
    format: json
