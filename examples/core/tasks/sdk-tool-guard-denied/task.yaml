format: ageval.task/1
task_id: sdk-tool-guard-denied
parameters:
  call_limit: 2
  mode: denied
agent_profiles: []
limits:
  wall_time_seconds: 60
  agent_invocations: 0
artifacts:
  publishable:
  - id: tool-trace
    path: artifacts/tool-trace.json
evaluation:
  inputs:
  - artifact: tool-trace
    target: artifacts/tool-trace.json
