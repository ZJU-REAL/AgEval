format: bora.task/1
task_id: attempt-trajectory
harness:
  runtime: python
  entrypoint: harness:run
parameters:
  harness_timeout_seconds: 360
  trajectory_mode: success
  models:
    default: solver
provider:
  kind: local
  assurance: l0
agent_profiles:
- id: solver
limits:
  wall_time_seconds: 360
  agent_invocations: 2
  environment_actions: 0
artifacts:
  publishable:
  - id: session-output
    producer: harness
    path: artifacts/session-output.json
    media_type: application/json
evaluation:
  runtime: python
  entrypoint: evaluator:evaluate
  network: none
  inputs:
  - artifact: session-output
    target: artifacts/session-output.json
  output:
    format: json
