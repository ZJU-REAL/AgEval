format: bora.task/1
task_id: agent-eval

harness:
  runtime: python
  entrypoint: harness:run

parameters:
  question: "Return the JSON object {\"answer\": 42} and nothing else."
  models:
    default: codex-mini

provider:
  kind: local
  assurance: l0

agent_profiles:
  - id: codex-mini
    executor: codex
    model: gpt-5.4-mini

limits:
  wall_time_seconds: 180
  agent_invocations: 1
  environment_actions: 0

artifacts:
  publishable:
    - id: agent-output
      producer: harness
      path: artifacts/agent-output.json
      media_type: application/json

evaluation:
  runtime: python
  entrypoint: evaluator:evaluate
  network: none
  inputs:
    - artifact: agent-output
      target: artifacts/agent-output.json
  output:
    format: json
