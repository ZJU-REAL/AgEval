format: ageval.profiles/1

# Spec 03 job: same recipe as docker, e2b box. Needs E2B_API_KEY.
environment: e2b

agent_profiles:
  solver:
    executor: acp
    model: zai-coding-cn/glm-5.2
    api_key: ${ZHIPU_API_KEY}
    options:
      entry: pi
    extensions:
      - plugin: acp
      - plugin: e2b
