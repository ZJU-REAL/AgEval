format: ageval.profiles/1

# Which box wins the exclusive `environment` slot for this job.
environment: local

agent_profiles:
  solver:
    executor: acp
    model: zai-coding-cn/glm-5.2
    api_key: ${ZHIPU_API_KEY}
    options:
      entry: pi
    extensions:
      - plugin: acp
      - plugin: local

  primary:
    executor: acp
    model: zai-coding-plan/glm-5.2
    api_key: ${glm_coding_api_key}
    options:
      entry: opencode
    extensions:
      - plugin: acp
      - plugin: local

  secondary:
    executor: acp
    model: zai-coding-cn/glm-5.2
    api_key: ${glm_coding_api_key}
    options:
      entry: pi
    extensions:
      - plugin: acp
      - plugin: local

  http-solver:
    executor: openai-http
    model: gpt-4.1-mini
    extensions:
      - plugin: openai-http
      - plugin: local
