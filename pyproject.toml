[project]
name = "bora"
dynamic = ["version"]
description = "Bounded Orchestration for Runtime Agents — Config Core (v0.1)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.2",
    "typer>=0.16.0",
    "bora-sdk",
    "agent-client-protocol==0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.12.0",
    "pyright>=1.1.400",
]
registry = [
    "psycopg[binary]>=3.2.0",
    "boto3>=1.35.0",
    "starlette>=0.41.0",
    "uvicorn>=0.32.0",
]
nooa = [
    "httpx[socks]>=0.28.1",
    "nooa>=0.0.7",
    "socksio>=1.0.0",
]
dsh = [
    "deepseek-harness-sdk==0.1.0rc6",
]

[project.scripts]
bora = "bora.cli.main:app"

[project.entry-points."bora.agent_executors"]
acp = "bora.adapters.agent_registry:_builtin_acp_factory"
openai-http = "bora.adapters.agent_registry:_builtin_openai_factory"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>\\S+)"

[tool.hatch.build.targets.wheel]
packages = ["src/bora"]
# Viewer SPA is built on demand (apps/viewer: pnpm build → dist/).
# Do not force-include dist: it is gitignored and breaks CI `uv sync --frozen`.

[tool.uv]
package = true
default-groups = ["dev"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.12.0",
    "pyright>=1.1.400",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs", "specs", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["plugins/nooa/src", "plugins/dsh/src", "plugins/home-files/src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.uv.sources]
bora-sdk = { path = "sdk/python", editable = true }
