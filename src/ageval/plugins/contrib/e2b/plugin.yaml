format: ageval.plugin/1
plugin_id: e2b
version: bundled
description: >
  E2B box: the Attempt runs in an [E2B](https://e2b.dev) cloud sandbox built
  from the task recipe (`environment: e2b`). This host needs
  `uv sync --extra e2b` and an API key. Hub listing does not mean this
  machine can run it; lock/run stay skip / fail-closed when the extra or
  key is missing.
host_requires:
  - import: e2b
    hint: uv sync --extra e2b
slots:
  exclusive:
    - id: environment
      priority: 100
      entry: ageval.plugins.contrib.e2b.host:E2BHost
