# ageval documentation website (Next.js standalone server).
#
# Released image (from repo root):
#   export AGEVAL_IMAGE_TAG=<tag>
#   docker compose -f website/docker-compose.yml pull && docker compose -f website/docker-compose.yml up -d
#
# Local build (no published image needed):
#   docker compose -f website/docker-compose.yml up -d --build
#
# TLS stays on the operator's Caddy/nginx in front of this container.

name: ageval-website

services:
  website:
    image: ghcr.io/zju-real/ageval-website:${AGEVAL_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_HUB_URL: ${NEXT_PUBLIC_HUB_URL:-}
    ports:
      - "3000:3000"
    restart: unless-stopped
