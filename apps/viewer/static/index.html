<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BORA Viewer</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <header class="brand">
          <div class="logo">BORA</div>
          <div class="sub">local viewer</div>
        </header>
        <section id="db-meta" class="panel muted">Loading…</section>
        <section class="panel">
          <h2>Tasks</h2>
          <ul id="task-list" class="task-list"></ul>
        </section>
        <section class="panel commands" id="suite-commands">
          <h2>Commands</h2>
          <div id="suite-cmd-list"></div>
        </section>
      </aside>
      <main id="main">
        <div id="empty" class="empty">
          <h1>Select a task</h1>
          <p>Open a member task to preview README, instruction, and files.</p>
        </div>
        <div id="detail" class="hidden">
          <header class="detail-head">
            <h1 id="task-title">—</h1>
            <div id="task-cmds" class="cmd-row"></div>
          </header>
          <nav class="tabs" id="tabs">
            <button type="button" data-tab="readme" class="tab active">README</button>
            <button type="button" data-tab="instruction" class="tab">Instruction</button>
            <button type="button" data-tab="files" class="tab">Files</button>
            <button type="button" data-tab="yaml" class="tab">task.yaml</button>
          </nav>
          <section id="tab-readme" class="tab-panel"></section>
          <section id="tab-instruction" class="tab-panel hidden"></section>
          <section id="tab-files" class="tab-panel hidden files-layout">
            <div id="file-tree" class="file-tree"></div>
            <div id="file-preview" class="file-preview">
              <div class="muted">Select a file</div>
            </div>
          </section>
          <section id="tab-yaml" class="tab-panel hidden"></section>
        </div>
      </main>
    </div>
    <div id="toast" class="toast hidden"></div>
    <script src="/app.js"></script>
  </body>
</html>
