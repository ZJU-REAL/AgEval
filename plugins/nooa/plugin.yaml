format: ageval.plugin/1
plugin_id: nooa
version: 0.1.0
host_requires:
  - import: nooa
    hint: "uv sync --extra nooa"
slots:
  provide:
    - id: executor
      priority: 110
      entry: "nooa_plugin.factory:build_executor"
  "on":
    - id: image_contribute
      priority: 110
      entry: "nooa_plugin.hooks:image_contribute"
    - id: trajectory_collect
      priority: 110
      entry: "nooa_plugin.hooks:trajectory_collect"
