format: ageval.plugin/1
plugin_id: slot-probe
version: 0.1.0
slots:
  provide:
    # Deterministic host executor for L0 e2e (no real LLM).
    - id: executor
      priority: 80
      entry: "slot_probe.factory:build_executor"
    - id: evaluation_runtime
      priority: 80
      entry: "slot_probe.factory:build_evaluation_runtime"
  "on":
    - id: before_agent_open
      priority: 50
      entry: "slot_probe.hooks:before_agent_open"
    - id: after_agent_open
      priority: 50
      entry: "slot_probe.hooks:after_agent_open"
    - id: before_agent_invoke
      priority: 50
      entry: "slot_probe.hooks:before_agent_invoke"
    - id: after_agent_invoke
      priority: 50
      entry: "slot_probe.hooks:after_agent_invoke"
    - id: normalize_agent_result
      priority: 50
      entry: "slot_probe.hooks:normalize_agent_result"
    - id: before_agent_close
      priority: 50
      entry: "slot_probe.hooks:before_agent_close"
    - id: after_agent_close
      priority: 50
      entry: "slot_probe.hooks:after_agent_close"
    - id: trajectory_collect
      priority: 50
      entry: "slot_probe.hooks:trajectory_collect"
    - id: trajectory_enrich
      priority: 50
      entry: "slot_probe.hooks:trajectory_enrich"
    - id: evidence_extra
      priority: 50
      entry: "slot_probe.hooks:evidence_extra"
    - id: env_prepare_commands
      priority: 50
      entry: "slot_probe.hooks:after_env_prepare"
    - id: env_inject
      priority: 50
      entry: "slot_probe.hooks:env_inject"
    - id: env_teardown_commands
      priority: 50
      entry: "slot_probe.hooks:env_teardown"
    - id: evaluation_input_contribute
      priority: 50
      entry: "slot_probe.hooks:evaluation_input_contribute"
    - id: score_postprocess
      priority: 50
      entry: "slot_probe.hooks:score_postprocess"
