format: ageval.plugin/1
plugin_id: miniswe
version: 0.1.0
description: Drive mini-swe-agent on the parent host; the Attempt container only runs bash via docker exec. Not ACP.
host_requires:
  - import: minisweagent
    hint: "uv sync --extra miniswe"
slots:
  exclusive:
    - id: executor
      priority: 110
      entry: "miniswe_plugin.factory:build_executor"
  chain:
    - id: trajectory_collect
      priority: 110
      entry: "miniswe_plugin.hooks:trajectory_collect"
inject:
  - service: environment
    capabilities: [exec]
config:
  image_layers: docker/Dockerfile.bake
