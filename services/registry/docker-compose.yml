# Local Registry stack probe (Spec 21 / Constitution D6.10).
# v1 local defaults: Postgres metadata + RustFS (S3-compatible blob).
# The in-process service currently uses SQLite + filesystem blob for zero-dep
# smoke; this compose is the production-shaped local stack for e2e when ready.
#
# Usage (when wiring S3/Postgres backends):
#   docker compose -f services/registry/docker-compose.yml up -d
#   export BORA_REGISTRY_URL=http://127.0.0.1:8700
#
# Probe without full service wiring:
#   docker compose -f services/registry/docker-compose.yml up -d postgres rustfs
#   docker compose -f services/registry/docker-compose.yml ps

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bora
      POSTGRES_PASSWORD: bora
      POSTGRES_DB: bora_registry
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bora -d bora_registry"]
      interval: 5s
      timeout: 3s
      retries: 10

  rustfs:
    # S3-compatible local object store (Constitution: RustFS is v1 local default).
    # Image tag may need operator pin; if pull fails, record in BLOCKED.md — do not
    # silently switch the product default to MinIO.
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: bora
      RUSTFS_SECRET_KEY: boraborabora
    ports:
      - "9000:9000"
    volumes:
      - rustfs-data:/data

volumes:
  rustfs-data:
