# Local Registry stack (Postgres metadata + RustFS S3-compatible blob).
# Production-shaped defaults for operator smoke; zero-dep unit tests still use
# SQLite + memory via --local / --memory-blob.
#
# Usage:
#   docker compose -f services/registry/docker-compose.yml up -d
#   cp services/registry/.env.example services/registry/.env  # fill secrets
#   uv sync --extra registry
#   uv run --extra registry python -m services.registry.app
#   export BORA_REGISTRY_URL=http://127.0.0.1:8700

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bora
      POSTGRES_PASSWORD: bora
      POSTGRES_DB: bora_registry
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bora -d bora_registry"]
      interval: 5s
      timeout: 3s
      retries: 10

  rustfs:
    # S3-compatible local object store (v1 local default = RustFS).
    # Image tag may need operator pin; if pull fails, open a GitHub Issue — do not
    # silently switch the product default to MinIO.
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: bora
      RUSTFS_SECRET_KEY: boraborabora
    ports:
      - "9000:9000"
    volumes:
      - rustfs-data:/data

volumes:
  rustfs-data:
