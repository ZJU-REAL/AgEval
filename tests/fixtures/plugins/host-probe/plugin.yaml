format: ageval.plugin/1
plugin_id: host-probe
version: 0.1.0
host_requires:
  - import: host_probe_vendor_sdk
    hint: "install the host extra to run this plugin"
  - file: compositions/default.yml
slots:
  exclusive:
    - id: executor
      priority: 50
      entry: "host_probe_plugin.factory:build_executor"
  chain:
    - id: after_environment_ready
      priority: 50
      entry: "host_probe_plugin.hooks:mark_ready"
