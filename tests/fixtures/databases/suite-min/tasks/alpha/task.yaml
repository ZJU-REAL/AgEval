format: bora.task/1
task_id: alpha

harness:
  runtime: python
  entrypoint: harness:run

parameters:
  sleep_ms: 200
  expect_pass: true

provider:
  kind: local
  assurance: l0

agent_profiles: []

limits:
  wall_time_seconds: 60
  agent_invocations: 0
  environment_actions: 0

artifacts:
  publishable:
    - id: result
      producer: harness
      path: artifacts/result.json
      media_type: application/json

evaluation:
  runtime: python
  entrypoint: evaluator:evaluate
  network: none
  inputs:
    - artifact: result
      target: artifacts/result.json
  output:
    format: json
