format: bora.task/1
task_id: hello

harness:
  runtime: python
  entrypoint: harness:run

parameters:
  seed: 1
  models:
    default: mock-default

provider:
  kind: local
  assurance: l0

agent_profiles:
  - id: mock-default
    executor: mock
    model: none

limits:
  wall_time_seconds: 60
  agent_invocations: 1
  environment_actions: 0

artifacts:
  publishable:
    - id: result
      producer: harness
      path: artifacts/result.json
      media_type: application/json

evaluation:
  runtime: python
  entrypoint: evaluator:evaluate
  network: none
  inputs:
    - artifact: result
      target: artifacts/result.json
  output:
    format: json
