format: ageval.task/1
task_id: hello
parameters:
  seed: 1
  models:
    default: mock-default
agent_profiles:
- id: mock-default
limits:
  wall_time_seconds: 60
  agent_invocations: 1
artifacts:
  publishable:
  - id: result
    path: artifacts/result.json
evaluation:
  inputs:
  - artifact: result
    target: artifacts/result.json
