[project]
name = "bora-sdk"
dynamic = ["version"]
description = "BORA Harness Core SDK (HC-1) — types for package harness authors"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>\\S+)"

[tool.hatch.build.targets.wheel]
packages = ["src/bora_sdk"]
