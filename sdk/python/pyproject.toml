[project]
name = "ageval-sdk"
dynamic = ["version"]
description = "ageval task SDK — types for dataset task run.py authors"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>\\S+)"

[tool.hatch.build.targets.wheel]
packages = ["src/ageval_sdk"]
